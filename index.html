<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Full-screen mobile with notch support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>MD Logistics</title>

    <!-- SEO -->
    <meta name="description" content="MD Logistics – A fast, secure courier and delivery management system." />
    <meta name="keywords" content="MD Logistics, courier management, delivery tracking" />
    <meta name="author" content="MD Logistics" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA / Mobile Web App -->
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MD Logistics" />
    
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:title" content="MD Logistics" />
    <meta property="og:description" content="Fast, secure courier and delivery management." />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Performance: preconnect to Supabase -->
    <link rel="preconnect" href="https://prahbbodynevpioaosuh.supabase.co" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
